apply plugin: 'com.android.application'

android {
  namespace "com.iosx.activex"
  compileSdkVersion rootProject.ext.compileSdkVersion

  sourceSets {
    main {
      java {
        srcDirs = ['src/main/java']
      }
      jniLibs.srcDirs = ['libs']
    }
  }

  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'password'
      keyAlias 'key0'
      keyPassword 'password'
    }
  }

  defaultConfig {
    applicationId "com.iosx.activex"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 31
    versionName "31"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    multiDexEnabled true

    aaptOptions {
      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
    debug {
      minifyEnabled false
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.debug
    }
  }

  bundle {
    density {
      enableSplit true
    }
    abi {
      enableSplit true
    }
    language {
      enableSplit true
    }
  }

  packagingOptions
    {
    jniLibs {
      useLegacyPackaging = false
    }

    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/proguard/coroutines.pro'
    exclude 'META-INF/body_sl_release.kotlin_module'
    exclude 'META-INF/ppbasekit_debug.kotlin_module'

    exclude 'META-INF/ppcalculatekit_debug.kotlin_module'
    exclude 'META-INF/ppbluetoothkit_debug.kotlin_module'

//    exclude "lib/arm64-v8a/libICBleProtocol.so"
//    exclude "lib/arm64-v8a/libICLogger.so"
//    exclude "lib/arm64-v8a/libICBodyFatAlgorithms.so"

    pickFirst 'com/icomon/icbodyfatalgorithms/BuildConfig.class'
  }

  repositories {
    flatDir {
      dirs 'libs'
    }
  }
}

repositories {
  flatDir {
    dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
  }
}

dependencies {
//  implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
  implementation "androidx.core:core-splashscreen:1.0.1"
  implementation "androidx.constraintlayout:constraintlayout:2.1.4"
  implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.0.0"

  implementation(name: "ICDeviceManager", ext: "aar")
//  implementation(name: "ppbasekit-4.6.8", ext: "aar")
//  implementation(name: "ppbasiccalculatekit-1.1.0", ext: "aar")
//  implementation(name: "ppcalculatekit-4.6.8", ext: "aar")
//  implementation(name: "ppbluetoothkit-4.6.8", ext: "aar")
  // implementation(name: "ppscale-3.1.5-20260422.075910-1", ext: "aar")

 api 'com.lefu.ppbasekit:ppbasekit:4.6.14'
//Bluetooth library
 api 'com.lefu:bluetoothkit:1.5.5'
//Bluetooth Data Protocol Analysis Library
 api 'com.lefu.ppbluetoothkit:ppbluetoothkit:4.6.14'
//Body fat data analysis library
 api 'com.lefu.ppcalculatekit:ppcalculatekit:4.6.14'
//Body fat calculation library
 api 'com.lefu.ppbasiccalculatekit:ppbasiccalculatekit:1.1.1'

  implementation project(':capacitor-android')
  implementation project(':capacitor-cordova-android-plugins')

  implementation 'com.google.code.gson:gson:2.8.9'

  testImplementation "junit:junit:$junitVersion"
  androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
  androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

configurations.all {
  resolutionStrategy {
    eachDependency { details ->
      if (details.requested.group == 'com.icomon' && details.requested.name == 'icbodyfatalgorithms') {
        details.useVersion 'none'
      }
    }
  }
}

apply from: 'capacitor.build.gradle'

try {
  def servicesJSON = file('google-services.json')
  if (servicesJSON.exists() && servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
  }
} catch(Exception e) {
  logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
