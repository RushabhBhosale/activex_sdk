apply plugin: 'com.android.library'

android {
  namespace "com.iosx.activex"
  compileSdkVersion rootProject.ext.compileSdkVersion

  sourceSets {
    main {
      java {
        srcDirs = ['src/main/java']
      }
      jniLibs.srcDirs = ['libs']
    }
  }

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    multiDexEnabled true
    consumerProguardFiles 'proguard-rules.pro'

    aaptOptions {
      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
    debug {
      minifyEnabled false
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  packagingOptions
    {
    jniLibs {
      useLegacyPackaging = false
    }

    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/proguard/coroutines.pro'
    exclude 'META-INF/body_sl_release.kotlin_module'
    exclude 'META-INF/ppbasekit_debug.kotlin_module'

    exclude 'META-INF/ppcalculatekit_debug.kotlin_module'
    exclude 'META-INF/ppbluetoothkit_debug.kotlin_module'

    pickFirst 'com/icomon/icbodyfatalgorithms/BuildConfig.class'
  }

  repositories {
    flatDir {
      dirs 'libs'
    }
  }
}

repositories {
  flatDir {
    dirs 'libs'
  }
}

dependencies {
//  implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
  implementation "androidx.core:core-splashscreen:1.0.1"
  implementation "androidx.constraintlayout:constraintlayout:2.1.4"
  implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.0.0"


 implementation 'com.lefu.ppbasekit:ppbasekit:4.6.14'
//Bluetooth library
 implementation 'com.lefu:bluetoothkit:1.5.5'
//Bluetooth Data Protocol Analysis Library
 implementation 'com.lefu.ppbluetoothkit:ppbluetoothkit:4.6.14'
//Body fat data analysis library
 implementation 'com.lefu.ppcalculatekit:ppcalculatekit:4.6.14'
//Body fat calculation library
 implementation 'com.lefu.ppbasiccalculatekit:ppbasiccalculatekit:1.1.1'

  implementation 'com.google.code.gson:gson:2.8.9'

  testImplementation "junit:junit:$junitVersion"
  androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
  androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

configurations.all {
  resolutionStrategy {
    force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'

    eachDependency { details ->
      if (details.requested.group == 'com.icomon' && details.requested.name == 'icbodyfatalgorithms') {
        details.useVersion 'none'
      }
    }
  }
}

try {
  def servicesJSON = file('google-services.json')
  if (servicesJSON.exists() && servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
  }
} catch(Exception e) {
  logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// The client receives one standalone AAR. Keep the PP/Lefu runtime inside
// that AAR so client applications do not need to declare the vendor SDKs.
def standaloneRuntimeFiles = [
  'ppbasekit-4.6.14.aar',
  'bluetoothkit-1.5.5.jar',
  'ppbluetoothkit-4.6.14.aar',
  'ppcalculatekit-4.6.14.aar',
  'ppbasiccalculatekit-1.1.1.aar',
  'gson-2.8.9.jar'
]

tasks.register('mergeStandaloneReleaseAar') {
  doLast {
    File aarFile = file("$buildDir/outputs/aar/app-release.aar")
    File stagingDir = file("$buildDir/intermediates/standalone-aar/release")
    File mergedClassesDir = file("$stagingDir/classes")
    File temporaryAar = file("$buildDir/outputs/aar/app-release-standalone.aar")

    if (!aarFile.exists()) {
      throw new GradleException("Expected release AAR was not found at $aarFile")
    }

    delete stagingDir
    delete temporaryAar
    copy {
      from zipTree(aarFile)
      into stagingDir
      includeEmptyDirs = false
    }
    mkdir mergedClassesDir

    def mergeJar = { File jarFile ->
      copy {
        from zipTree(jarFile)
        into mergedClassesDir
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
      }
    }

    mergeJar(new File(stagingDir, 'classes.jar'))

    configurations.releaseRuntimeClasspath.resolve()
      .findAll { standaloneRuntimeFiles.contains(it.name) }
      .each { File dependencyFile ->
        if (dependencyFile.name.endsWith('.aar')) {
          def dependencyTree = zipTree(dependencyFile)
          dependencyTree.matching { include 'classes.jar' }.files.each { File dependencyClasses ->
            mergeJar(dependencyClasses)
          }
          copy {
            from dependencyTree.matching { include 'assets/**', 'jni/**' }
            into stagingDir
            includeEmptyDirs = false
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
          }
        } else {
          mergeJar(dependencyFile)
        }
      }

    delete new File(stagingDir, 'classes.jar')
    ant.jar(destfile: new File(stagingDir, 'classes.jar'), basedir: mergedClassesDir)
    delete mergedClassesDir

    ant.zip(destfile: temporaryAar, basedir: stagingDir)
    if (!aarFile.delete() || !temporaryAar.renameTo(aarFile)) {
      throw new GradleException("Could not replace $aarFile with the standalone AAR")
    }

    delete stagingDir
    logger.lifecycle("Created standalone AAR: $aarFile")
  }
}

tasks.configureEach { task ->
  if (task.name == 'bundleReleaseAar') {
    task.finalizedBy('mergeStandaloneReleaseAar')
  }
}
