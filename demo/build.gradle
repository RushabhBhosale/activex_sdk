plugins {
  id 'com.android.application' version '8.5.2'
}

def demoReleaseStoreFile = findProperty('demoReleaseStoreFile') ?: System.getenv('DEMO_RELEASE_STORE_FILE')
def demoReleaseStorePassword = findProperty('demoReleaseStorePassword') ?: System.getenv('DEMO_RELEASE_STORE_PASSWORD')
def demoReleaseKeyAlias = findProperty('demoReleaseKeyAlias') ?: System.getenv('DEMO_RELEASE_KEY_ALIAS')
def demoReleaseKeyPassword = findProperty('demoReleaseKeyPassword') ?: System.getenv('DEMO_RELEASE_KEY_PASSWORD')
def hasDemoReleaseSigning = [
  demoReleaseStoreFile,
  demoReleaseStorePassword,
  demoReleaseKeyAlias,
  demoReleaseKeyPassword
].every { it }

android {
  namespace "com.iosx.activex"
  compileSdk 35

  signingConfigs {
    if (hasDemoReleaseSigning) {
      demoRelease {
        storeFile file(demoReleaseStoreFile)
        storePassword demoReleaseStorePassword
        keyAlias demoReleaseKeyAlias
        keyPassword demoReleaseKeyPassword
      }
    }
  }

  defaultConfig {
    // The scale secret is generated for this exact application ID.
    applicationId "com.iosx.activex"
    minSdk 22
    targetSdk 35
    versionCode 1
    versionName "1.0"
  }

  buildTypes {
    release {
      // The demo must produce an installable APK by default. A supplied
      // keystore is preferred; otherwise use the Android Studio debug key
      // so release can update a locally installed debug demo.
      signingConfig hasDemoReleaseSigning ? signingConfigs.demoRelease : signingConfigs.debug
    }
  }
}

dependencies {
  implementation(name: 'activeXSdk', ext: 'aar')

  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
  implementation "androidx.core:core-splashscreen:1.0.1"
  implementation "androidx.constraintlayout:constraintlayout:2.1.4"
  implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.0.0"

}

configurations.all {
  resolutionStrategy {
    force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
  }
}
